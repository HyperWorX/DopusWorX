<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Release notes</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font: 16px/1.6 system-ui, "Segoe UI", sans-serif; color: #e6e9f0;
           background: radial-gradient(1200px 600px at 30% -10%, #2a2f45, #14161f 60%); padding: 48px; }
    .card { max-width: 680px; margin: 0 auto; background: #1b1f2c; border: 1px solid #2c3346;
            border-radius: 16px; box-shadow: 0 18px 50px rgba(0, 0, 0, .45); padding: 36px 40px; }
    h1 { margin: 0 0 4px; font-size: 30px; letter-spacing: -.5px; color: #f4f6fb; }
    .tag { display: inline-block; background: #6c8cff; color: #0b1020; font-size: 12px;
           font-weight: 700; padding: 4px 10px; border-radius: 999px; margin-bottom: 18px; }
    h2 { margin: 26px 0 8px; font-size: 18px; color: #9fb4ff; }
    ul { margin: 0; padding-left: 20px; } li { margin: 6px 0; color: #c7cede; }
    code { background: #262c3d; color: #cdd6f4; padding: 2px 6px; border-radius: 6px; font-size: 14px; }
    .ok { color: #6ee7a8; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <span class="tag">DopusWorX</span>
    <h1>Release notes</h1>
    <p>HTML documents render as their own page, with their own styles, inside the
       Directory Opus viewer pane.</p>
    <h2>Highlights</h2>
    <ul>
      <li><span class="ok">&#10003;</span> A full maths workspace</li>
      <li><span class="ok">&#10003;</span> CSV grid editor</li>
      <li><span class="ok">&#10003;</span> 30 colour palettes</li>
      <li>Switch to <code>Source</code> to see this markup</li>
    </ul>
  </div>
</body>
</html>
